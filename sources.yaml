# Event sources checked every morning.
#
# kind:
#   page  - fetch the HTML, strip it to text, let Claude extract events (default)
#   ical  - an iCalendar feed, parsed directly (Meetup groups)
#   offer - a page describing a standing discount/offer; becomes one "offer" card
# category: book | read | philo | art | event | offer
# aggregator: true  -> big listing; only events matching INTERESTS are kept
# details: true     -> for new events without a price, open the event page once to look for price/deadline
# enabled: false    -> not checked at all (hiding a source in the app is separate and per user)

